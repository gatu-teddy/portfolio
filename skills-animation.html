<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skills Animation — Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f0ee;
  --surface: #fff;
  --accent: #3f9a2f;
  --mint: #dff1dc;
  --ink: #111;
  --ink-2: #4a4a48;
  --muted: #8e8e8a;
  --line: #ecebe8;
  --shadow: 0 2px 4px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); font-family: "Onest", system-ui, sans-serif; overflow: hidden; }

#scene { position: relative; width: 100vw; height: 100vh; }

/* floor */
#floor {
  position: absolute; bottom: 90px; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,transparent 0%,var(--line) 8%,var(--line) 92%,transparent 100%);
}
#floor-shadow {
  position: absolute; bottom: 84px; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(to bottom, rgba(0,0,0,.04), transparent);
}

/* scattered bubbles */
.bubble {
  position: absolute;
  padding: 7px 15px; border-radius: 999px;
  background: var(--mint); color: var(--ink-2);
  font-size: 12px; font-weight: 500; white-space: nowrap;
  box-shadow: 0 2px 10px rgba(63,154,47,.15);
  transform-origin: center; pointer-events: none;
  will-change: transform, opacity;
}

/* character wrapper — sits on the floor */
#char-wrap {
  position: absolute; bottom: 92px; left: 0;
  transform-origin: bottom center;
  will-change: transform;
}

/* skills card */
#skills-card {
  position: absolute; right: 48px; top: 50%; transform: translateY(-50%);
  width: 310px; background: var(--surface); border-radius: 18px;
  box-shadow: var(--shadow); padding: 24px 22px 28px;
  min-height: 420px; max-height: 85vh;
  overflow-y: auto; scrollbar-width: none;
}
#skills-card::-webkit-scrollbar { display: none; }
#skills-card h2 {
  font-size: 17px; font-weight: 600; color: var(--ink);
  margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
}
#skills-card h2 .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
}
.skill-group { margin-bottom: 18px; }
.skill-group h3 {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-block; padding: 5px 12px; border-radius: 999px;
  background: var(--mint); color: var(--ink-2);
  font-size: 11px; font-weight: 500; white-space: nowrap;
  opacity: 0; will-change: transform, opacity;
}

/* bag counter */
#bag-count {
  position: absolute; font-size: 10px; font-weight: 700;
  color: #5a3800; background: #ffd84d; border-radius: 999px;
  padding: 2px 6px; opacity: 0; pointer-events: none;
  transform: translate(-50%,-120%); white-space: nowrap;
}

/* hint */
#hint {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: var(--muted); opacity: 0;
  pointer-events: none; white-space: nowrap;
}
</style>
</head>
<body>
<div id="scene">
  <div id="floor"></div>
  <div id="floor-shadow"></div>

  <!-- ═══════════════════════════════════════
       CHARACTER SVG
       Origin: (0,0) = ground level, centre
  ════════════════════════════════════════ -->
  <div id="char-wrap">
    <svg id="guy" viewBox="-21 -108 42 118" width="50" height="140" overflow="visible">

      <!-- ── RIGHT LEG (draw first / behind) ── -->
      <g id="leg-r">
        <!-- upper pant -->
        <rect x="1"  y="-44" width="13" height="30" rx="5" fill="#c8903a"/>
        <!-- rolled cuff -->
        <rect x="0"  y="-16" width="14" height="7"  rx="3" fill="#b07a28"/>
        <!-- boot shaft -->
        <rect x="1"  y="-10" width="13" height="17" rx="3" fill="#7a3e22"/>
        <!-- boot toe -->
        <ellipse cx="7"  cy="8" rx="9" ry="5" fill="#6a3018"/>
        <!-- laces -->
        <line x1="3"  y1="1"  x2="11" y2="1"  stroke="#bbb" stroke-width=".8"/>
        <line x1="3"  y1="4"  x2="11" y2="4"  stroke="#bbb" stroke-width=".8"/>
      </g>

      <!-- ── LEFT LEG ── -->
      <g id="leg-l">
        <!-- upper pant (slightly lighter for depth) -->
        <rect x="-14" y="-44" width="13" height="30" rx="5" fill="#d49840"/>
        <!-- rolled cuff -->
        <rect x="-14" y="-16" width="14" height="7"  rx="3" fill="#c08830"/>
        <!-- boot shaft -->
        <rect x="-14" y="-10" width="13" height="17" rx="3" fill="#8a4428"/>
        <!-- boot toe -->
        <ellipse cx="-7" cy="8" rx="9" ry="5" fill="#7a3418"/>
        <!-- laces -->
        <line x1="-11" y1="1"  x2="-3"  y2="1"  stroke="#bbb" stroke-width=".8"/>
        <line x1="-11" y1="4"  x2="-3"  y2="4"  stroke="#bbb" stroke-width=".8"/>
      </g>

      <!-- ── BELT ── -->
      <rect x="-14" y="-48" width="28" height="6"  rx="2" fill="#4a2808"/>
      <!-- buckle -->
      <rect x="-3"  y="-49" width="6"  height="7"  rx="1" fill="#999"/>
      <rect x="-2"  y="-48" width="4"  height="5"  rx=".5" fill="none" stroke="#777" stroke-width=".8"/>

      <!-- ── RIGHT ARM (holds bag — drawn BEHIND torso) ── -->
      <g id="arm-r">
        <!-- sleeve -->
        <rect x="11"  y="-74" width="11" height="22" rx="5.5" fill="#ede8d8"/>
        <!-- forearm (skin) -->
        <rect x="12"  y="-54" width="9"  height="14" rx="4"   fill="#8b5e38"/>
        <!-- hand -->
        <ellipse cx="16.5" cy="-38" rx="5.5" ry="4.5" fill="#8b5e38"/>
      </g>

      <!-- ── TORSO / SHIRT ── -->
      <g id="body-group">
        <!-- shirt body -->
        <rect x="-14" y="-83" width="28" height="37" rx="5" fill="#ede8d8"/>
        <!-- collar V -->
        <path d="M -4 -83 L 0 -76 L 4 -83" fill="#d8d2c0" stroke="#cac0ae" stroke-width=".5"/>
        <!-- left chest pocket -->
        <rect x="-12" y="-77" width="9" height="8" rx="2" fill="#e2dac8" stroke="#cec4b0" stroke-width=".6"/>
        <!-- right chest pocket -->
        <rect x="3"   y="-77" width="9" height="8" rx="2" fill="#e2dac8" stroke="#cec4b0" stroke-width=".6"/>
        <!-- shirt buttons -->
        <circle cx="0" cy="-69" r="1.2" fill="#cec0ae"/>
        <circle cx="0" cy="-62" r="1.2" fill="#cec0ae"/>
        <circle cx="0" cy="-55" r="1.2" fill="#cec0ae"/>
        <!-- SUSPENDERS over shirt -->
        <path d="M -5 -83 C -6 -72 -8 -62 -9 -48" stroke="#9b7040" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <path d="M  5 -83 C  6 -72  8 -62  9 -48" stroke="#9b7040" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <!-- neck -->
        <rect x="-5" y="-88" width="10" height="8" rx="3" fill="#8b5e38"/>
      </g>

      <!-- ── LEFT ARM (swings) ── -->
      <g id="arm-l">
        <!-- sleeve -->
        <rect x="-22" y="-74" width="11" height="22" rx="5.5" fill="#ede8d8"/>
        <!-- forearm (skin) -->
        <rect x="-21" y="-54" width="9"  height="14" rx="4"   fill="#8b5e38"/>
        <!-- hand -->
        <ellipse cx="-16.5" cy="-38" rx="5.5" ry="4.5" fill="#8b5e38"/>
      </g>

      <!-- ── HEAD ── -->
      <!-- locs mass (behind head) -->
      <ellipse cx="0"   cy="-100" rx="17" ry="10"  fill="#1e1008"/>
      <!-- hanging side locs -->
      <ellipse cx="-15" cy="-92"  rx="4.5" ry="10" fill="#1e1008" transform="rotate(-14 -15 -92)"/>
      <ellipse cx="-18" cy="-95"  rx="3.5" ry="8"  fill="#241410" transform="rotate(-22 -18 -95)"/>
      <ellipse cx="15"  cy="-92"  rx="4.5" ry="10" fill="#1e1008" transform="rotate(14  15 -92)"/>
      <ellipse cx="18"  cy="-95"  rx="3.5" ry="8"  fill="#241410" transform="rotate(22  18 -95)"/>
      <!-- top locs -->
      <ellipse cx="-7"  cy="-106" rx="4"   ry="8"  fill="#2a1808" transform="rotate(-8 -7 -106)"/>
      <ellipse cx="0"   cy="-108" rx="4"   ry="8"  fill="#1e1008"/>
      <ellipse cx="7"   cy="-106" rx="4"   ry="8"  fill="#2a1808" transform="rotate(8  7 -106)"/>

      <!-- head (skin) -->
      <ellipse cx="0" cy="-92" rx="15" ry="16" fill="#8b5e38"/>

      <!-- HEADBAND / tam brim -->
      <rect x="-16" y="-101" width="32" height="10" rx="5" fill="#c4622a"/>
      <!-- headband highlight stripe -->
      <rect x="-14" y="-101" width="28" height="4"  rx="2" fill="#d4722a" opacity=".5"/>
      <!-- small hat dome above band -->
      <ellipse cx="0" cy="-103" rx="12" ry="5" fill="#b8541e"/>

      <!-- FACE -->
      <!-- eyebrows -->
      <path d="M -9 -91 Q -6 -94 -3 -92" stroke="#2a1808" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M  3 -92 Q  6 -94  9 -91" stroke="#2a1808" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- eye whites -->
      <ellipse cx="-6"  cy="-88" rx="3.5" ry="4" fill="#fff"/>
      <ellipse cx=" 6"  cy="-88" rx="3.5" ry="4" fill="#fff"/>
      <!-- pupils -->
      <circle  cx="-5.5" cy="-87.5" r="2.5" fill="#2a1808"/>
      <circle  cx=" 5.5" cy="-87.5" r="2.5" fill="#2a1808"/>
      <!-- highlights -->
      <circle  cx="-4.5" cy="-88.5" r=".8"  fill="#fff"/>
      <circle  cx=" 6.5" cy="-88.5" r=".8"  fill="#fff"/>
      <!-- nose -->
      <path d="M -1.5 -84 Q 0 -82.5 1.5 -84" stroke="#6a4028" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <!-- mouth -->
      <path id="mouth" d="M -6 -79 Q 0 -75 6 -79" stroke="#5a3018" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- teeth -->
      <path d="M -4.5 -79 Q 0 -76 4.5 -79" fill="#fff" opacity=".85"/>
      <!-- blush -->
      <ellipse cx="-10" cy="-84" rx="3.5" ry="2" fill="#a06040" opacity=".3"/>
      <ellipse cx=" 10" cy="-84" rx="3.5" ry="2" fill="#a06040" opacity=".3"/>

      <!-- ── BAG (grows as skills are collected) ── -->
      <g id="bag-group" opacity="0">
        <line   id="bag-string" x1="16.5" y1="-38" x2="22" y2="-20" stroke="#c09030" stroke-width="1.8" stroke-linecap="round"/>
        <circle id="bag-body"   cx="22" cy="-12" r="0"  fill="#f0c030"/>
        <!-- bag tie -->
        <ellipse id="bag-tie"   cx="22" cy="-19" rx="0" ry="0" fill="#c09030"/>
        <!-- bag shine -->
        <circle id="bag-shine"  cx="18" cy="-16" r="0"  fill="#fff" opacity=".35"/>
      </g>

      <!-- ── WAVE ARM (hidden — replaces arm-l on celebration) ── -->
      <g id="arm-wave" opacity="0">
        <rect  x="-22" y="-74" width="11" height="22" rx="5.5" fill="#ede8d8"/>
        <rect  x="-21" y="-54" width="9"  height="14" rx="4"   fill="#8b5e38"/>
        <ellipse cx="-16.5" cy="-38" rx="5.5" ry="4.5" fill="#8b5e38"/>
      </g>

    </svg>
    <div id="bag-count"></div>
  </div><!-- /char-wrap -->

  <!-- Skills card -->
  <div id="skills-card">
    <h2><span class="dot"></span>Skill Insights</h2>
    <div id="card-content"></div>
  </div>

  <div id="hint"></div>
</div><!-- /scene -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ─────────────────────────────────────────
   DATA
───────────────────────────────────────── */
const SKILLS = {
  "Product": [
    "Product Management","Product Ownership","Roadmapping","Backlog Management",
    "User Stories & ACs","Business Analysis","Requirements Gathering",
    "Competitive Analysis","Agile · Scrum · Kanban","Stakeholder Management",
    "UI/UX Collaboration","Release Coordination","Technical PM",
    "Zero-to-one builds","B2B go-to-market"
  ],
  "Engineering": [
    "Solution Architecture","React.js / Next.js","TypeScript","Supabase / PostgreSQL",
    "Claude API & AI","n8n automation","REST & webhooks",
    "Twilio / WhatsApp API","AWS SES","Vercel · Railway · R2",
    "SDLC · Testing","Git / GitHub"
  ],
  "Tools": [
    "Jira","Notion","Slack","Figma","Framer",
    "Memberstack","Meta Business API","Claude Code"
  ]
};
const ALL_SKILLS  = Object.entries(SKILLS).flatMap(([g, arr]) => arr.map(n => ({ n, g })));
const TOTAL       = ALL_SKILLS.length;

/* ─────────────────────────────────────────
   LAYOUT CONSTANTS
───────────────────────────────────────── */
const W         = window.innerWidth;
const H         = window.innerHeight;
const FLOOR_Y   = H - 92;           // bottom edge of char-wrap in viewport
const CARD_LEFT = W - 48 - 310;     // left edge of skills card

/* ─────────────────────────────────────────
   NODES
───────────────────────────────────────── */
const scene    = document.getElementById('scene');
const charWrap = document.getElementById('char-wrap');
const bagBody  = document.getElementById('bag-body');
const bagTie   = document.getElementById('bag-tie');
const bagShine = document.getElementById('bag-shine');
const bagGrp   = document.getElementById('bag-group');
const bagCount = document.getElementById('bag-count');
const hint     = document.getElementById('hint');
const mouth    = document.getElementById('mouth');
const armWave  = document.getElementById('arm-wave');
const armL     = document.getElementById('arm-l');

/* ─────────────────────────────────────────
   SCATTER BUBBLES
───────────────────────────────────────── */
// Shuffle
for (let i = ALL_SKILLS.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [ALL_SKILLS[i], ALL_SKILLS[j]] = [ALL_SKILLS[j], ALL_SKILLS[i]];
}

const bubbles = ALL_SKILLS.map(skill => {
  const el  = document.createElement('span');
  el.className   = 'bubble';
  el.textContent = skill.n;
  const bx = 30 + Math.random() * Math.max(80, CARD_LEFT - 100);
  const by = FLOOR_Y - 20 - Math.random() * (H * 0.50);
  gsap.set(el, { x: bx, y: by, opacity: 0, scale: 0 });
  scene.appendChild(el);
  return { el, bx, by };
});

/* ─────────────────────────────────────────
   CHARACTER STATE
───────────────────────────────────────── */
let charX    = -60;
let bagR     = 0;
let collected = 0;
let walkTimer = null;
let legPhase  = 0;
let facing    = 1;  // 1 = right, -1 = left

function setCharX(x) {
  charX = x;
  gsap.set(charWrap, { x });
}

/* walking tick — GSAP rotates legs via svgOrigin */
function walkTick() {
  legPhase += 0.55;
  const angle = Math.sin(legPhase) * 32;
  const bob   = -Math.abs(Math.sin(legPhase)) * 3;

  gsap.to('#leg-l', { rotation: angle,  svgOrigin: "-7 -44", duration: .08, overwrite: true });
  gsap.to('#leg-r', { rotation: -angle, svgOrigin: "7 -44",  duration: .08, overwrite: true });
  gsap.to('#arm-l', { rotation: -angle * .55, svgOrigin: "-13 -74", duration: .08, overwrite: true });
  gsap.to('#body-group', { y: bob, duration: .08, overwrite: true });
}

function startWalk(dir) {
  facing = dir;
  gsap.set('#guy', { scaleX: dir });
  if (!walkTimer) walkTimer = setInterval(walkTick, 90);
}

function stopWalk() {
  if (walkTimer) { clearInterval(walkTimer); walkTimer = null; }
  legPhase = 0;
  gsap.to(['#leg-l','#leg-r','#arm-l'], { rotation: 0, duration: .18 });
  gsap.to('#body-group', { y: 0, duration: .18 });
}

function walkTo(targetX) {
  const dist = Math.abs(targetX - charX);
  if (dist < 3) return Promise.resolve();
  const dir = targetX > charX ? 1 : -1;
  const dur = Math.max(.22, dist / 440);
  startWalk(dir);
  return new Promise(resolve => {
    gsap.to(charWrap, {
      x: targetX, duration: dur, ease: 'none',
      onUpdate() { charX = gsap.getProperty(charWrap, 'x'); },
      onComplete() { charX = targetX; stopWalk(); resolve(); }
    });
  });
}

/* ─────────────────────────────────────────
   VACUUM A BUBBLE
───────────────────────────────────────── */
function vacuum(bubble) {
  return new Promise(resolve => {
    // bag hangs from right hand — right hand is at char origin + ~37px right + ~38px up
    // in viewport: charX + 25 (body half) + 12 (arm extend), y = FLOOR_Y - 38
    const tx = charX + (facing === 1 ? 38 : -38);
    const ty = FLOOR_Y - 38;

    gsap.to(bubble.el, {
      x: tx - bubble.bx,
      y: ty - bubble.by,
      scale: 0, opacity: 0,
      duration: .30, ease: 'back.in(2)',
      onComplete() {
        bubble.el.style.display = 'none';
        collected++;
        // grow bag
        bagR = Math.min(bagR + 1.4, 20);
        gsap.to(bagBody,  { attr: { r: bagR },        duration: .12, ease: 'back.out(2)' });
        gsap.to(bagTie,   { attr: { rx: bagR * .45, ry: bagR * .3 }, duration: .12 });
        gsap.to(bagShine, { attr: { r: bagR * .3 },   duration: .12 });
        gsap.set(bagGrp,  { opacity: 1 });
        // counter
        bagCount.textContent = `${collected}`;
        gsap.set(bagCount, {
          left: charX + (facing === 1 ? 48 + bagR : -bagR),
          top:  FLOOR_Y - 20 - bagR * 1.2,
          opacity: 1
        });
        hint.textContent = `${collected} / ${TOTAL} collected`;
        resolve();
      }
    });
  });
}

/* ─────────────────────────────────────────
   BUILD CARD CONTENT
───────────────────────────────────────── */
function buildCard() {
  const content = document.getElementById('card-content');
  content.innerHTML = '';
  Object.entries(SKILLS).forEach(([group, chips]) => {
    const g = document.createElement('div');
    g.className = 'skill-group';
    g.innerHTML = `<h3>${group}</h3><div class="chips">${
      chips.map(c => `<span class="chip">${c}</span>`).join('')
    }</div>`;
    content.appendChild(g);
  });
}

/* ─────────────────────────────────────────
   MAIN SEQUENCE
───────────────────────────────────────── */
async function run() {
  // 1 — bubbles pop in
  await sleep(500);
  await new Promise(r =>
    gsap.to('.bubble', {
      opacity: 1, scale: 1, duration: .5,
      stagger: { amount: 1.8, from: 'random' },
      ease: 'back.out(2)', onComplete: r
    })
  );

  // 2 — walk in + show hint
  await sleep(300);
  gsap.to(hint, { opacity: 1, duration: .4 });
  hint.textContent = 'collecting skills…';
  await walkTo(80);

  // 3 — collect left → right sweep
  const sorted = [...bubbles].sort((a, b) => a.bx - b.bx);
  for (const b of sorted) {
    await walkTo(b.bx - 16);
    await vacuum(b);
    await sleep(50);
  }

  // 4 — walk to card
  await sleep(280);
  hint.textContent = 'delivering to skills card…';
  await walkTo(CARD_LEFT - 60);
  await sleep(180);

  // 5 — dump pose (tilt)
  gsap.to(charWrap, {
    rotate: -22, transformOrigin: 'bottom center',
    duration: .4, ease: 'back.out(1.5)',
    yoyo: true, repeat: 1
  });
  await sleep(380);

  // 6 — bag empties
  gsap.to(bagBody,  { attr: { r: 0 }, duration: .45, ease: 'back.in' });
  gsap.to(bagTie,   { attr: { rx: 0, ry: 0 }, duration: .35 });
  gsap.to(bagShine, { attr: { r: 0 }, duration: .35 });
  gsap.to(bagCount, { opacity: 0, duration: .25 });

  // 7 — chips fall into card with stagger
  buildCard();
  await sleep(120);
  await new Promise(r =>
    gsap.fromTo('.chip',
      { opacity: 0, y: -18, scale: .85 },
      { opacity: 1, y: 0, scale: 1, duration: .36,
        stagger: { amount: 1.5, ease: 'power1.in' },
        ease: 'back.out(2.5)', onComplete: r }
    )
  );

  // 8 — celebrate
  await sleep(220);
  gsap.set('#guy', { scaleX: -1 });       // face the card
  gsap.set(armL,   { opacity: 0 });
  gsap.set(armWave,{ opacity: 1 });
  gsap.to(armWave, {
    rotation: -65, svgOrigin: "-13 -74",
    duration: .35, ease: 'back.out(2)',
    yoyo: true, repeat: 5
  });
  gsap.to(mouth, {
    attr: { d: 'M -7 -79 Q 0 -72 7 -79' },
    duration: .3
  });

  hint.textContent = '✓ all skills delivered';
  await sleep(2600);

  // 9 — fade out hint
  gsap.to(hint, { opacity: 0, duration: .7 });
  gsap.set(armWave,{ opacity: 0 });
  gsap.set(armL,   { opacity: 1 });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

setCharX(-60);
run();
</script>
</body>
</html>
