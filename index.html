<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teddy Gatu — Portfolio</title>
  <meta name="description" content="Portfolio of Teddy Gatu, full-stack developer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name"></span></a>
    <nav class="topnav">
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
      <a id="resume-link" class="icon-btn" href="#" target="_blank" rel="noopener" aria-label="Open résumé">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
      </a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 id="headline"></h1>
      <p class="sub" id="subline"></p>
    </section>

    <section class="stage" id="work">
      <div class="stage-col">
      <div class="segmented" role="tablist" aria-label="Portfolio sections">
        <button role="tab" aria-selected="true"  data-view="projects">Projects</button>
        <button role="tab" aria-selected="false" data-view="experience">Experience</button>
      </div>
      <div class="app-window">
        <aside class="rail" aria-hidden="true">
          <span class="rail-icon active"></span><span class="rail-icon"></span><span class="rail-icon"></span><span class="rail-icon"></span>
        </aside>
        <div class="app-body">
          <div class="app-head">
            <h2 id="view-title">Portfolio Workspace</h2>
            <div class="meta-row">
              <span class="avatar" id="avatar"></span>
              <span class="pill lav">Open to work</span>
              <span class="pill peach" id="location-pill"></span>
              <span class="pill mint">Remote friendly</span>
            </div>
            <div class="subtabs" id="subtabs"></div>
          </div>
          <div id="view" class="view"></div>
        </div>
      </div>
      </div>

      <div class="stage-col">
        <div class="segmented solo"><span>Skills</span></div>
        <div class="app-window skills-window">
          <div class="app-body">
            <div class="app-head">
              <h2>Skill Insights</h2>
              <p class="fine skills-lede">What I bring to a team, grouped by discipline.</p>
              <div class="subtabs" id="skill-tabs" role="tablist" aria-label="Skill groups"></div>
            </div>
            <div id="skills-view" class="view"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="contact" id="contact">
      <h2>Have a project in mind?</h2>
      <p class="sub">Let's build something that works as good as it looks.</p>
      <div class="contact-actions" id="contact-actions"></div>
    </section>
  </main>

  <footer class="footer"><span id="footer-text"></span></footer>

  <div class="drawer-scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
    <button class="drawer-close" id="drawer-close" aria-label="Close">×</button>
    <div id="drawer-content"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
